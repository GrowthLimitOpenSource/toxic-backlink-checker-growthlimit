name: Bug report
description: Report reproducible incorrect behavior in the Toxic Backlink Checker.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing issues first. Do not include API credentials, customer backlink data, private audit reports, or exploitable security details. Report security issues privately through the repository's Security tab.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release version or commit SHA where the problem occurs.
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Web application
        - Command line
        - Docker setup
        - Node.js setup
        - Report export
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the problem. Use synthetic or redacted data only.
      placeholder: |
        1. Start the application with ...
        2. Create an audit using ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Docker or Node.js version, browser if relevant, and installation method.
      placeholder: macOS 15; Docker Desktop 4.x; Chrome 140
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add relevant logs, screenshots, or sample output after removing credentials, customer data, and private URLs.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, customer data, private audit output, and other sensitive information.
          required: true
        - label: This report does not describe an exploitable security vulnerability.
          required: true
